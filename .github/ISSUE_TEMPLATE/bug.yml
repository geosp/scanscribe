name: Bug report
description: Something does not behave as documented. For security problems, use private vulnerability reporting instead.
title: "Bug: <short description>"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems must not be reported here.** Use the repository's Security tab, "Report a vulnerability".

        **Do not attach book pages or OCR output of books** (they are usually copyrighted). Describe the input, or reproduce with a page you made yourself.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The observed behavior, with the exact command, output or error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The expected behavior, and where it is documented if it is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the input (PDF or image folder, page count, language, one or two columns, scan or screenshot).
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: scanscribe version or commit, OS, Python version, the extra installed (gpu or cpu), and the device used (GPU model and driver version, or CPU). Remove host names and paths you do not want public.
    validations:
      required: true
